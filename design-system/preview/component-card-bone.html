<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bone card</title>
<link rel="stylesheet" href="preview.css">
<style></style>
</head>
<body>
<div class="card ">
  <div class="tag">DEFAULT CARD · BONE</div>
  <div style="background:var(--bone-50); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow: 0 1px 2px rgba(17,20,15,0.04), 0 8px 24px -8px rgba(17,20,15,0.08); display:flex; gap:18px; align-items:center;">
    <div style="width:72px; height:72px; border-radius:12px; background:#2C4A35; flex-shrink:0;"></div>
    <div class="col" style="gap:4px; flex:1;">
      <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; color:var(--ink-muted);">[ A1 ] OPERATING</div>
      <div style="font-family:var(--font-sans); font-size:18px; font-weight:500;">Mérida, Yucatán</div>
      <div style="font-family:var(--font-sans); font-size:13px; color:var(--ink-muted);">450,000 tonnes/yr · since 2024</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#11140F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
  </div>
</div>
