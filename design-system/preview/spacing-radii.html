<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corner radii</title>
<link rel="stylesheet" href="preview.css">
<style>.card{min-height:200px}</style>
</head>
<body>
<div class="card ">
  <div class="tag">RADIUS · SHAPES</div>
  <div class="row" style="gap:16px; align-items:flex-end;">
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:72px; height:72px; background:var(--hydrochar-900); border-radius:4px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">xs · 4</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:72px; height:72px; background:var(--hydrochar-900); border-radius:8px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">sm · 8</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:72px; height:72px; background:var(--hydrochar-900); border-radius:12px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">md · 12</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:72px; height:72px; background:var(--hydrochar-900); border-radius:16px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">lg · 16</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:72px; height:72px; background:var(--hydrochar-900); border-radius:20px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">xl · 20</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:72px; height:72px; background:var(--hydrochar-900); border-radius:28px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">2xl · 28</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:72px; height:72px; background:var(--hydrochar-900); border-radius:40px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">3xl · 40</div>
    </div>
    <div class="col" style="gap:6px; align-items:center;">
      <div style="width:72px; height:72px; background:var(--moss-600); border-radius:999px;"></div>
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">pill · ∞</div>
    </div>
  </div>
</div>
</body>
</html>
