<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadow system</title>
<link rel="stylesheet" href="preview.css">
<style>.card{min-height:200px} body{background:var(--bone-100);}</style>
</head>
<body>
<div class="card ">
  <div class="tag">ELEVATION · 3 LEVELS</div>
  <div class="row" style="gap:24px; padding:24px 0;">
    <div style="flex:1; background:var(--bone-50); height:120px; border-radius:16px; box-shadow: 0 1px 2px rgba(17,20,15,0.04), 0 8px 24px -8px rgba(17,20,15,0.08); display:flex; align-items:flex-end; padding:14px;">
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">--shadow-card</div>
    </div>
    <div style="flex:1; background:var(--bone-50); height:120px; border-radius:16px; box-shadow: 0 2px 4px rgba(17,20,15,0.06), 0 24px 48px -16px rgba(17,20,15,0.18); display:flex; align-items:flex-end; padding:14px;">
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">--shadow-panel</div>
    </div>
    <div style="flex:1; background:var(--bone-50); height:120px; border-radius:16px; box-shadow: 0 4px 12px rgba(17,20,15,0.10), 0 32px 64px -16px rgba(17,20,15,0.22); display:flex; align-items:flex-end; padding:14px;">
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--ink-muted);">--shadow-pop</div>
    </div>
  </div>
</div>
</body>
</html>
