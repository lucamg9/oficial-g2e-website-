<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type scale</title>
<link rel="stylesheet" href="preview.css">
<style>.card{min-height:340px}</style>
</head>
<body>
<div class="card ">
  <div class="col" style="gap:6px;">
    <div style="font-family:var(--font-display); font-size:64px; line-height:0.95; letter-spacing:-0.025em;">Display 64</div>
    <div style="font-family:var(--font-display); font-size:44px; line-height:1; letter-spacing:-0.025em;">H1 — 44</div>
    <div style="font-family:var(--font-display); font-size:32px; line-height:1.05; letter-spacing:-0.025em;">H2 — 32</div>
    <div style="font-family:var(--font-sans); font-size:22px; font-weight:500; line-height:1.1;">H3 — 22 Sans Medium</div>
    <div style="font-family:var(--font-sans); font-size:16px;">Body — 16 Sans Regular. The work is the emphasis.</div>
    <div style="font-family:var(--font-sans); font-size:13px; color:var(--ink-muted);">Caption — 13 Sans Regular, muted</div>
    <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-muted);">EYEBROW — 11 MONO 140 TRACKED</div>
  </div>
</div>
</body>
</html>
