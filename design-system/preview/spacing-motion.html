<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion — easings + durations</title>
<link rel="stylesheet" href="preview.css">
<style>.card{min-height:240px}</style>
</head>
<body>
<div class="card ">
  <div class="tag">MOTION · RESTRAINED</div>
  <div class="col" style="gap:14px; font-family:var(--font-mono); font-size:12px;">
    <div class="row" style="gap:14px;"><div style="width:130px;">--ease-expo</div><div style="color:var(--ink-muted);">cubic-bezier(0.22, 1, 0.36, 1)</div></div>
    <div class="row" style="gap:14px;"><div style="width:130px;">--ease-quart</div><div style="color:var(--ink-muted);">cubic-bezier(0.25, 1, 0.5, 1)</div></div>
    <div class="row" style="gap:14px;"><div style="width:130px;">--dur-fast</div><div style="color:var(--ink-muted);">160ms · hover, press</div></div>
    <div class="row" style="gap:14px;"><div style="width:130px;">--dur-base</div><div style="color:var(--ink-muted);">320ms · reveals, transitions</div></div>
    <div class="row" style="gap:14px;"><div style="width:130px;">--dur-slow</div><div style="color:var(--ink-muted);">600ms · large entrances</div></div>
  </div>
  <div style="font-family:var(--font-sans); font-size:13px; color:var(--ink-muted); margin-top:4px; max-width:560px;">No bounces. No spring overshoots. Translate distances are small — 8–16px max.</div>
</div>
</body>
</html>
