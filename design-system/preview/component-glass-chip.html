<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass chip — overlay on photo</title>
<link rel="stylesheet" href="preview.css">
<style>.card{padding:24px 28px} body{background:var(--bone-100)}</style>
</head>
<body>
<div class="card ">
  <div class="tag">GLASS · OVERLAY</div>
  <div style="position:relative; height:200px; border-radius:20px; overflow:hidden; background:linear-gradient(135deg,#2C4A35 0%, #1F3526 60%, #11140F 100%);">
    <div style="position:absolute; left:20px; bottom:20px; display:flex; gap:10px;">
      <div style="backdrop-filter: blur(18px) saturate(140%); background:rgba(242,239,231,0.66); padding:12px 16px; border-radius:14px; display:flex; align-items:center; gap:10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#11140F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <div class="col" style="gap:2px;">
          <div style="font-family:var(--font-sans); font-size:11px; color:var(--ink-muted); line-height:1;">MÉRIDA · YUC.</div>
          <div style="font-family:var(--font-sans); font-size:14px; font-weight:500; line-height:1;">Plant 01</div>
        </div>
      </div>
      <div style="backdrop-filter: blur(18px) saturate(140%); background:rgba(17,20,15,0.55); color:var(--bone-100); padding:12px 16px; border-radius:14px; display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12px;">
        <span style="width:6px; height:6px; border-radius:99px; background:var(--bone-100);"></span>
        OPERATING
      </div>
    </div>
  </div>
</div>
</body>
</html>
