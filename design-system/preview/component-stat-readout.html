<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stat readout — aligned</title>
<link rel="stylesheet" href="preview.css">
<style>
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--bone-50);
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px var(--line);
    overflow: hidden;
  }
  .stat {
    padding: 20px 18px;
    display: grid;
    grid-template-rows: 44px 1fr;
    row-gap: 10px;
    border-right: 1px solid var(--line);
    align-content: start;
  }
  .stat:last-child { border-right: none; }
  .stat-num {
    font-family: var(--font-display);
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.025em;
    align-self: end;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-family: var(--font-sans);
    font-size: 12px;
    line-height: 1.35;
    color: var(--ink-muted);
  }
</style>
</head>
<body>
<div class="card ">
  <div class="tag">PLANT READOUT</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-num">1.2M</div>
      <div class="stat-label">tonnes/yr<br>processed</div>
    </div>
    <div class="stat">
      <div class="stat-num">78%</div>
      <div class="stat-label">CO₂e reduction<br>vs landfill</div>
    </div>
    <div class="stat">
      <div class="stat-num">99.4%</div>
      <div class="stat-label">uptime,<br>last 12 mo.</div>
    </div>
    <div class="stat">
      <div class="stat-num">4</div>
      <div class="stat-label">signed<br>off‑take deals</div>
    </div>
  </div>
</div>
</body>
</html>
