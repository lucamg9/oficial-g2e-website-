<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo mark</title>
<link rel="stylesheet" href="preview.css">
<style>
  .card{align-items:center; justify-content:center; min-height:240px;}
  .marks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
  }
  .marks > div {
    border-radius: 14px;
    padding: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 180px;
  }
  .on-bone { background: var(--bone-50); border: 1px solid var(--line); }
  .on-dark { background: var(--hydrochar-900); }
</style>
</head>
<body>
<div class="card ">
  <div class="tag">MARK · BOTH SURFACES</div>
  <div class="marks">
    <div class="on-bone">
      <img src="../assets/logo-mark.svg" width="120" height="120" alt="G2E mark"/>
    </div>
    <div class="on-dark">
      <img src="../assets/logo-mark-dark.svg" width="120" height="120" alt="G2E mark dark"/>
    </div>
  </div>
  <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; color:var(--ink-muted); text-transform:uppercase;">Hydrochar disc · Newsreader g</div>
</div>
</body>
</html>
