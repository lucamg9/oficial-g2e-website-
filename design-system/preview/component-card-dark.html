<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hydrochar panel</title>
<link rel="stylesheet" href="preview.css">
<style>.card{padding:20px 28px}</style>
</head>
<body>
<div class="card ">
  <div style="background:#11140F; color:var(--bone-100); border-radius:28px; padding:28px; box-shadow: 0 2px 4px rgba(17,20,15,0.06), 0 24px 48px -16px rgba(17,20,15,0.18); display:flex; flex-direction:column; gap:18px;">
    <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; color:rgba(242,239,231,0.5);">[ 02 ] OFF‑TAKE</div>
    <div style="font-family:var(--font-display); font-size:32px; line-height:1.05; letter-spacing:-0.02em; max-width:480px;">Replacing mineral coal, one shipment at a time.</div>
    <div class="row" style="gap:14px;">
      <button style="font-family:var(--font-sans); font-size:14px; font-weight:500; background:var(--bone-100); color:var(--hydrochar-900); border:none; padding:12px 22px; border-radius:999px; display:inline-flex; align-items:center; gap:10px; cursor:pointer;">
        Partner with us
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
      </button>
      <button style="font-family:var(--font-sans); font-size:14px; font-weight:500; background:transparent; color:var(--bone-100); border:1px solid rgba(242,239,231,0.22); padding:12px 22px; border-radius:999px; display:inline-flex; align-items:center; gap:10px; cursor:pointer;">
        Read the brief
      </button>
    </div>
  </div>
</div>
</body>
</html>
