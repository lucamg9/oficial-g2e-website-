<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form input</title>
<link rel="stylesheet" href="preview.css">
<style>.card{min-height:220px}</style>
</head>
<body>
<div class="card ">
  <div class="tag">INPUT · LINE STYLE</div>
  <div class="col" style="gap:6px;">
    <label style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; color:var(--ink-muted); text-transform:uppercase;">Organization</label>
    <input value="SEMARNAT — Secretaría de Medio Ambiente" style="font-family:var(--font-sans); font-size:15px; padding:12px 0; background:transparent; border:none; border-bottom:1px solid var(--line-strong); color:var(--ink); width:100%; outline:none;"/>
  </div>
  <div class="col" style="gap:6px;">
    <label style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; color:var(--ink-muted); text-transform:uppercase;">Interest</label>
    <div class="row" style="gap:8px; padding-top:4px;">
      
        <button style="font-family:var(--font-sans); font-size:13px; font-weight:500; padding:8px 14px; border-radius:999px; border:1px solid var(--line-strong); background:transparent; color:var(--ink); cursor:pointer;">Off‑take</button>
      
        <button style="font-family:var(--font-sans); font-size:13px; font-weight:500; padding:8px 14px; border-radius:999px; border:1px solid var(--hydrochar-900); background:var(--hydrochar-900); color:var(--bone-100); cursor:pointer;">Investment</button>
      
        <button style="font-family:var(--font-sans); font-size:13px; font-weight:500; padding:8px 14px; border-radius:999px; border:1px solid var(--line-strong); background:transparent; color:var(--ink); cursor:pointer;">Research</button>
      
        <button style="font-family:var(--font-sans); font-size:13px; font-weight:500; padding:8px 14px; border-radius:999px; border:1px solid var(--line-strong); background:transparent; color:var(--ink); cursor:pointer;">Press</button>
      
    </div>
  </div>
</div>
</body>
</html>
