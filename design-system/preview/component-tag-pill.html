<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category tags</title>
<link rel="stylesheet" href="preview.css">
</head>
<body>
<div class="card ">
  <div class="tag">TAGS · CATEGORY · STATE</div>
  <div class="row" style="gap:10px;">
    <span style="font-family:var(--font-sans); font-size:13px; padding:8px 14px; border-radius:999px; border:1px solid var(--line-strong); color:var(--ink);">Hydrochar</span>
    <span style="font-family:var(--font-sans); font-size:13px; padding:8px 14px; border-radius:999px; border:1px solid var(--line-strong); color:var(--ink);">Hydrothermal Carbonization</span>
    <span style="font-family:var(--font-sans); font-size:13px; padding:8px 14px; border-radius:999px; border:1px solid var(--line-strong); color:var(--ink);">Decarbonization</span>
    <span style="font-family:var(--font-sans); font-size:13px; padding:8px 14px; border-radius:999px; border:1px solid var(--line-strong); color:var(--ink);">Off‑take</span>
  </div>
  <div class="row" style="gap:10px;">
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; padding:6px 12px; border-radius:999px; background:var(--hydrochar-900); color:var(--bone-100); display:inline-flex; align-items:center; gap:6px;">
      <span style="width:6px; height:6px; border-radius:99px; background:var(--bone-100);"></span>OPERATING
    </span>
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; padding:6px 12px; border-radius:999px; background:var(--moss-600); color:var(--bone-100); display:inline-flex; align-items:center; gap:6px;">
      <span style="width:6px; height:6px; border-radius:99px; background:var(--bone-100);"></span>PERMITTING
    </span>
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; padding:6px 12px; border-radius:999px; background:transparent; color:var(--ink-muted); border:1px solid var(--line-strong); display:inline-flex; align-items:center; gap:6px;">
      <span style="width:6px; height:6px; border-radius:99px; background:var(--ink-muted);"></span>PROSPECT
    </span>
  </div>
</div>
</body>
</html>
